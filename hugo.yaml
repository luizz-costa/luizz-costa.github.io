baseURL: https://luizz-costa.github.io/
locale: pt-BR
# Fuso usado nas datas dos posts e do feed (igual no seu PC e no GitHub Actions).
timeZone: America/Sao_Paulo
title: Luiz Felipe Costa
theme: hugo-theme-nightfall

# Só tags (sem categorias). Os posts escolhem tags de um vocabulário fixo:
# aws, docker, linux, homelab, dotnet, seguranca, portfolio
taxonomies:
  tag: tags

# Formatos gerados: só HTML. O Hugo gera RSS sozinho na página inicial, nas seções e nas tags,
# mas o único feed que faz sentido aqui é o do blog (ligado na seção do blog).
outputs:
  home:
    - html
  section:
    - html
  taxonomy:
    - html
  term:
    - html

# Recomendado pela documentação do Hugo para o deploy no GitHub Pages
caches:
  images:
    dir: :cacheDir/images

# Menu do cabeçalho (o tema mostra cada item como ~/nome)
menus:
  header:
    - name: sobre
      url: /#sobre
      weight: 1
    - name: trajetoria
      url: /#trajetoria
      weight: 2
    - name: projetos
      url: /#projetos
      weight: 3
    - name: blog
      url: /blog/
      weight: 4
    - name: contato
      url: /#contato
      weight: 5

params:
  # Cabeçalho do tema: luiz@homelab ~ $
  user: luiz
  hostname: homelab

  sitedescription: Estudante de Sistemas de Informação na PUC Minas, focado em back-end e infraestrutura. Projetos com C#/.NET, PostgreSQL, Docker e Linux.
  openLinksInNewTab: true

  # Cor de destaque do tema: blue, orange, green, red ou um hex
  styles:
    color: orange

  # Formato da data na listagem e nos posts (dia/mês/ano)
  displayDateFormat: "02/01/2006"

  footerHtml: '© 2026 Luiz Felipe Costa'

  author:
    name: Luiz Felipe Costa
    # Outras formas do nome, só para o Google ligar as buscas a este site (não aparecem na página)
    outrosNomes: ["Luiz Felipe Alves Costa", "Luiz Costa"]
    email: luizcostavzp@gmail.com
    avatar: /img/luiz.jpg
    iniciais: LF

  # Dados da apresentação na página inicial
  portfolio:
    subtitulo: Back-end e infraestrutura
    perfil: "Estudante de Sistemas de Informação na PUC\u00A0Minas, focado em back-end e infraestrutura."
    status: Disponível para estágio em BH
    links:
      - nome: GitHub
        url: https://github.com/luizz-costa
        icone: github
      - nome: LinkedIn
        url: https://www.linkedin.com/in/luizz-costa/
        icone: linkedin
      - nome: Currículo
        url: /curriculo.pdf
        icone: curriculo
      - nome: E-mail
        url: mailto:luizcostavzp@gmail.com
        icone: email

# Realce de sintaxe dos blocos de código: o Hugo marca cada trecho com uma classe CSS (cores em assets/css/codigo.css)
markup:
  highlight:
    noClasses: false
  goldmark:
    parser:
      # Imagem sozinha numa linha deixa de ser embrulhada num <p>: assim vira <figure> com legenda (layouts/_markup/render-image.html).
      wrapStandAloneImageWithinParagraph: false